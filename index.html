<!-- Order Form Container -->
<div id="order-form-container" class="form-section">
    <h3>አገልግሎት ማዘዣ ፎርም (Order Form)</h3>
    <form id="bota-order-form">
        
        <!-- Customer Name -->
        <div class="form-group">
            <label for="customer-name">ሙሉ ስም (Full Name)</label>
            <input type="text" id="customer-name" placeholder="ስምዎን ያስገቡ" required>
        </div>

        <!-- Phone Number -->
        <div class="form-group">
            <label for="customer-phone">ስልክ ቁጥር (Phone Number)</label>
            <input type="tel" id="customer-phone" placeholder="09........" required>
        </div>

        <!-- Service Choice -->
        <div class="form-group">
            <label for="service-type">የሚፈልጉት አገልግሎት (Select Service)</label>
            <select id="service-type" required>
                <option value="" disabled selected>አገልግሎት ይምረጡ</option>
                <option value="telegram_bot">Telegram Bot Development</option>
                <option value="web_app">Web Application</option>
                <option value="automation">Business Workflow Automation</option>
            </select>
        </div>

        <!-- Bank Dropdown Option -->
        <div class="form-group">
            <label for="bank-list">የክፍያ አማራጭ (Select Bank)</label>
            <select id="bank-list" required onchange="showAccountDetails()">
                <option value="" disabled selected>የሚከፍሉበትን ባንክ/ዋሌት ይምረጡ</option>
                <option value="telebirr">Telebirr (ቴሌብር)</option>
                <option value="cbe">Commercial Bank of Ethiopia (የኢትዮጵያ ንግድ ባንክ)</option>
                <option value="awash">Awash Bank (አዋሽ ባንክ)</option>
                <option value="nib">Nib International Bank (ንብ ባንክ)</option>
                <option value="oromia">Oromia Bank (ኦሮሚያ ባንክ)</option>
            </select>
        </div>

        <!-- Dynamic Account Info Display -->
        <div id="account-details-box" style="display: none; margin-top: 15px; padding: 10px; background-color: #f0f8ff; border-left: 4px solid #0088cc; border-radius: 4px;">
            <p id="account-text" style="font-weight: bold; font-size: 14px; color: #333;"></p>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" style="margin-top: 20px;">ትዕዛዝ ላክ (Submit Order)</button>
    </form>
</div>
